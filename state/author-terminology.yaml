policy: |
  本文件是作者术语与翻译动态表，属于动态状态层（DAILY_STATE_UPDATE），不属于Skill规则。
  作者正式报告中对板块/主题/ETF中文名、行业称谓、翻译错误的修正统一记录于此，正式成稿必须沿用。
  单项名称修正只更新本文件；禁止为此修改SKILL.md、references/或templates/，除非用户明确判定为系统性规则问题（进入DEVELOPMENT）。
  每天读取新的作者正式报告时同时检查本表是否需要更新；作者明确改过就记录并以后沿用。

