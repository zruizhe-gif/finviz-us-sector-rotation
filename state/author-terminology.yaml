author_editorial_rules:
  note: "作者对成稿写法的明确要求（动态状态层，不改Skill规则）；每次成稿前对照执行。"
  rules:
    - as_of: 2026-10-15
      source: "用户明确要求（2026-10-15对话）"
      rule: "核心结论按内容分段，不机械分段（不必固定'轮入侧/轮出侧'模板）。"
    - as_of: 2026-10-15
      source: "用户明确要求（2026-10-15对话）"
      rule: "众所周知的市场交易英文术语可保留，但不要动辄中英混杂表达。"
    - as_of: 2026-10-15
      source: "用户明确要求（2026-10-15对话）"
      rule: "报告必须跟进最新宏观交易动态。"
    - as_of: 2026-10-14
      source_report: "history/daily/美股板块轮动观察｜2026.10.14.md"
      rule: "第三部分不要写太长：每个方向只写要点总结（直接触发、盈利预期要点、行情性质），不展开长篇论证。"
    - as_of: 2026-10-14
      source_report: "history/daily/美股板块轮动观察｜2026.10.14.md"
      rule: "第四部分不得乱加追加行。量子计算、太空科技、核能铀矿、加密货币等是新兴类别，可以单列；与固定行大量重合的细分行业不得追加（例如制药PPH与医疗保健XLV大量重合，作者已删除）。历史正式稿中出现过的追加行仅限社交媒体SOCL、量子计算QTUM这类非重合新兴类别。"
    - as_of: 2026-10-14
      source_report: "history/daily/美股板块轮动观察｜2026.10.14.md"
      rule: "当日有行情性质改判时，核心结论不得再写'当日无行情性质结构变化'；去掉冗余表述（如'没有一个清一色上涨'这类重复信息）。"
    - as_of: 2026-10-14
      source_report: "history/daily/美股板块轮动观察｜2026.10.14.md"
      rule: "云计算WCLD改判大型震荡：作者认为软件板块并未形成真正的板块beta、整体仍疲弱；单日回撤叠加板块疲弱时应主动审视趋势结构是否开始破坏，不要机械写'上涨结构未破坏'。"
    - as_of: 2026-10-16
      source: "用户明确要求（2026-10-16对话）"
      rule: "报告改为七部分：第六部分为宏观讨论（依据Bloomberg字幕研究，总结美国、欧洲、日本、中国等主要经济体最新数据，以及对宏观经济、企业盈利、货币政策、市场状况的讨论），第七部分为未来观察点。已写入Skill规则（references/03、05、08、10、12、14，templates，SKILL.md）。"
    - as_of: 2026-10-16
      source: "用户明确要求（2026-10-16对话）"
      rule: "反感情绪化浮夸表达（如'万物rally'）：用正常人的语气描述和还原市场波动的基本事实，不言过其实（BAN-010）。"
    - as_of: 2026-10-20
      source: "用户明确要求（2026-10-20对话）"
      rule: "'裁决''最终裁决'列为永久禁忌词（BAN-011），正文不得出现；直接写事件和要看的内容。"
    - as_of: 2026-10-20
      source: "用户明确要求（2026-10-20对话，针对10.19报告）"
      rule: "宏观讨论中'企业盈利预期'只写盈利本身；违约风险、信用利差、融资成本等信用问题放入'市场状况'，不得与盈利混为一谈。"
    - as_of: 2026-10-20
      source_report: "history/daily/美股板块轮动观察｜2026.10.16.md"
      rule: "作者把公用事业XLU当日涨幅由+1.35%改为+1.34%（原始值1.345）：ETF涨跌幅以Finviz显示值为准，三位小数恰为5的边界值不得机械四舍五入进位，报告前核对时按作者口径取较低一位。"
